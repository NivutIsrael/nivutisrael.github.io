  ttRows(tb).filter(pass).forEach(r => { const v = ttText(r.cells[j]); counts.set(v, (counts.get(v) || 0) + 1); });
  (ex[j] || []).forEach(v => counts.has(v) || counts.set(v, 0));
  const vals = [...counts.keys()], sv = vals.map(ttVal);
  const num = sv.filter(x => typeof x === "number").length * 2 >= sv.filter(x => x != null).length;
  const order = vals.map((_, i) => i).sort((a, b) => ttCmp(sv[a], sv[b], 1, false) || vals[a].localeCompare(vals[b], "he"));
  const s = st.sort?.[0] === j ? st.sort[1] : 0, hint = th.dataset.tth;
  const pop = document.createElement("div");
  pop.className = "ttpop"; pop.setAttribute("role", "dialog"); pop.setAttribute("aria-label", "מיון וסינון");
  pop.innerHTML = `<div class="tthead"><b>${ttEsc(ttLabel(th) || "עמודה")}</b>${hint ? `<small>${ttEsc(hint)}</small>` : ""}</div>
    <button type="button" class="ttsort${s > 0 ? " on" : ""}" data-dir="1">${num ? "↑ מיון מהקטן לגדול" : "↑ מיון מא׳ עד ת׳"}</button>
    <button type="button" class="ttsort${s < 0 ? " on" : ""}" data-dir="-1">${num ? "↓ מיון מהגדול לקטן" : "↓ מיון מת׳ עד א׳"}</button>
    <div class="ttsep"></div>
    <input type="search" class="ttq" placeholder="חיפוש ברשימה…" aria-label="חיפוש ברשימה" autocomplete="off">
    <div class="ttall"><button type="button" data-ttall="1">✓ בחירת הכול</button><button type="button" data-ttall="0">✕ ביטול הכול</button></div>
    <div class="ttlist">${order.map(i => `<label><input type="checkbox" data-i="${i}" ${ex[j]?.has(vals[i]) ? "" : "checked"}><span>${vals[i] === "" ? "(ריק)" : ttEsc(vals[i])}</span><small>${counts.get(vals[i])}</small></label>`).join("")}</div>
    <div class="ttfoot"><button type="button" class="ttclear" ${ex[j]?.size ? "" : "disabled"}>ניקוי הסינון</button><button type="button" class="ttcancel">ביטול</button><button type="button" class="ttok">אישור</button></div>`;
  document.body.appendChild(pop);
  TT.pop = { el: pop, k, j, vals, btn };
  if (innerWidth > 640) {                    // under the header; phones get a sheet at the bottom (CSS)
    const r = btn.getBoundingClientRect(), w = pop.offsetWidth, h = pop.offsetHeight;
    pop.style.left = Math.max(8, Math.min(innerWidth - w - 8, r.right - w)) + "px";
    pop.style.top = (r.bottom + 6 + h > innerHeight - 8 ? Math.max(8, r.top - h - 6) : r.bottom + 6) + "px";
  }
  if (!matchMedia("(pointer: coarse)").matches) pop.querySelector(".ttq").focus();
}
function ttCols(btn) {          // phones: the columns of a card table in one list; a tap opens that column's menu
  ttClose();
  const k = btn.dataset.ttcols, tb = ttTable(k); if (!tb) return;
  const st = TT.st[k] || {}, ex = st.ex || {};
  const pop = document.createElement("div");
  pop.className = "ttpop"; pop.setAttribute("role", "dialog"); pop.setAttribute("aria-label", "מיון וסינון");
  pop.innerHTML = `<div class="tthead"><b>מיון וסינון</b><small>בחרו עמודה כדי למיין לפיה או לסנן את הערכים שלה</small></div><div class="ttcols">`
    + ttHead(tb).map((th, j) => !th.querySelector(".ttb") ? "" : `<button type="button" class="ttcol" data-ttcol="${j}"><span>${ttEsc(ttLabel(th) || "עמודה " + (j + 1))}</span>`
      + `<small>${st.sort?.[0] === j ? `<b>${st.sort[1] > 0 ? "▲ ממוין" : "▼ ממוין"}</b> ` : ""}${ex[j]?.size ? "<b>מסונן</b> " : ""}‹</small></button>`).join("")
    + `</div><div class="ttfoot"><button type="button" class="ttcancel">סגירה</button></div>`;
  document.body.appendChild(pop);
  TT.pop = { el: pop, k, j: -1, vals: [], btn };
}
function ttClose() { if (!TT.pop) return; const b = TT.pop.btn; TT.pop.el.remove(); TT.pop = null; if (b?.isConnected && !matchMedia("(pointer: coarse)").matches) b.focus({ preventScroll: true }); }
function ttCanOk() { const P = TT.pop; if (!P) return;
  P.el.querySelector(".ttok").disabled = ![...P.el.querySelectorAll(".ttlist label:not([hidden]) input")].some(cb => cb.checked); }
function ttOk() {
  const P = TT.pop; if (!P || P.el.querySelector(".ttok").disabled) return;
  const searching = !!P.el.querySelector(".ttq").value.trim(), ex = new Set();
  // as in Excel: with a search, only the matching values that are ticked stay
  P.el.querySelectorAll(".ttlist input").forEach(cb => { if (!cb.checked || (searching && cb.closest("label").hidden)) ex.add(P.vals[+cb.dataset.i]); });
  ttSet(P.k, st => { if (ex.size) st.ex[P.j] = ex; else delete st.ex[P.j]; });
  ttClose();
}
function ttBind() {
  if (TT.bound) return;
  TT.bound = true;
  // capture: handled here before the page's own click handlers
  document.addEventListener("click", e => {
    const t = e.target, P = TT.pop;
    if (P && P.el.contains(t)) {
      e.stopPropagation();
      const col = t.closest("[data-ttcol]");
      if (col) { const b = ttHead(ttTable(P.k))[+col.dataset.ttcol]?.querySelector(".ttb"); if (b) ttOpen(b); return; }
      const sb = t.closest(".ttsort");
      if (sb) { const d = +sb.dataset.dir; ttSet(P.k, st => st.sort = st.sort?.[0] === P.j && st.sort[1] === d ? null : [P.j, d]); ttClose(); }
      else if (t.closest("[data-ttall]")) { const on = t.closest("[data-ttall]").dataset.ttall === "1";
        P.el.querySelectorAll(".ttlist label:not([hidden]) input").forEach(cb => cb.checked = on); ttCanOk(); }
      else if (t.closest(".ttclear")) { ttSet(P.k, st => delete st.ex[P.j]); ttClose(); }
      else if (t.closest(".ttcancel")) ttClose();
      else if (t.closest(".ttok")) ttOk();
      return;
    }
    const b = t.closest(".ttb");
    if (b) { e.stopPropagation(); e.preventDefault(); P?.btn === b ? ttClose() : ttOpen(b); return; }
    const cb = t.closest("[data-ttcols]");
    if (cb) { e.stopPropagation(); e.preventDefault(); P?.btn === cb ? ttClose() : ttCols(cb); return; }
    if (P) ttClose();                          // a click outside closes the menu and still does what it was for
    const rs = t.closest("[data-ttreset]");
    if (rs) { e.stopPropagation(); const nx = rs.closest(".ttbar")?.nextElementSibling, tb = nx?.matches("table") ? nx : nx?.querySelector("table");
      if (tb) { delete TT.st[tb.dataset.ttkey]; ttApply(tb); } return; }
    const th = t.closest("th.tt");
    if (th && th.dataset.legmap == null && !t.closest("a, button, input, select")) {
      e.stopPropagation();
      const tb = th.closest("table"), j = ttHead(tb).indexOf(th);
      ttSet(tb.dataset.ttkey, st => { const s = st.sort?.[0] === j ? st.sort[1] : 0; st.sort = s === 0 ? [j, 1] : s > 0 ? [j, -1] : null; });
    }
  }, true);
  document.addEventListener("change", e => { if (TT.pop?.el.contains(e.target)) ttCanOk(); });
  document.addEventListener("input", e => {
    if (!TT.pop || !e.target.classList?.contains("ttq")) return;
    const q = e.target.value.trim().toLowerCase();
    TT.pop.el.querySelectorAll(".ttlist label").forEach(l => l.hidden = !!q && !l.textContent.toLowerCase().includes(q));
    ttCanOk();
  });
  document.addEventListener("keydown", e => {
    if (!TT.pop) return;
    if (e.key === "Escape") { e.preventDefault(); ttClose(); }
    else if (e.key === "Enter" && e.target.classList?.contains("ttq")) { e.preventDefault(); ttOk(); }
  }, true);
}

let SHOWN = [];
function render() {
  const names = Object.keys(CLUBS).sort((a, b) => a.localeCompare(b, "he"));
  if (!names.length) { $("ttl").textContent = "עוד אין תוצאות עם מועדונים"; return; }
  const h = new URLSearchParams(location.hash.slice(1)), club = names.includes(h.get("c")) ? h.get("c") : names[0];
  $("club").innerHTML = names.map(n => `<option value="${esc(n)}"${n === club ? " selected" : ""}>${esc(n)} (${new Set(CLUBS[n].map(x => x.id)).size})</option>`).join("");
  const all = CLUBS[club].filter(x => COMPS[x.s] && (!$("young").checked || young(x.k)));
  $("ttl").textContent = club; document.title = `${club} · מועדונים · ניווט ישראל`;
  const people = new Set(all.map(x => x.id)), podium = all.filter(x => done(x) && x.cp <= 3).length, wins = all.filter(x => done(x) && x.cp === 1).length;
  $("tiles").innerHTML = [[people.size, "נווטים"], [all.length, "תוצאות"], [new Set(all.map(x => x.s)).size, "תחרויות"], [podium, "מקומות 1–3"], [wins, "ניצחונות"]]
    .map(([v, l]) => `<div><b>${v}</b><span>${l}</span></div>`).join("");
  // who improved: the gap to the winner, this competition against the one before (each runner's last two)
  const byId = {};
  all.forEach(x => (byId[x.id] ||= []).push(x));
  // (in the same category only: the gap to another category's winner is not the same measure - after a change, from the
  // second competition in the new one)
  const sameCat = (a, b) => String(a ?? "").replace(/\s+/g, "").toUpperCase() === String(b ?? "").replace(/\s+/g, "").toUpperCase();
  const better = Object.values(byId).map(rs => { rs = rs.filter(x => behind(x) != null).sort((a, b) => (COMPS[a.s].date || "").localeCompare(COMPS[b.s].date || ""));
    const b = rs[rs.length - 1], same = b ? rs.filter(x => sameCat(x.k, b.k)) : [];
    if (same.length < 2) return null; const a = same[same.length - 2], d = behind(a) - behind(b);
    return d > 0.5 ? { a, b, d } : null; }).filter(Boolean).sort((p, q) => q.d - p.d);
  $("better").innerHTML = better.length ? `<h2>השתפרו <small>${better.length}</small></h2><ul class="better">${better.slice(0, 12).map(({ a, b, d }) =>
    `<li><b>${esc(b.n)}</b> ${esc(b.k)} · <span dir="ltr">${behind(a).toFixed(0)}% → ${behind(b).toFixed(0)}%</span> מאחורי המנצח <span class="up">▲ ${d.toFixed(0)} נק׳ אחוז</span></li>`).join("")}</ul>` : "";
  // each competition, newest first
  const slugs = [...new Set(all.map(x => x.s))].sort((a, b) => (COMPS[b].date || "").localeCompare(COMPS[a].date || ""));
  SHOWN = [];
  $("list").innerHTML = slugs.map(s => { const c = COMPS[s], rs = all.filter(x => x.s === s).sort((a, b) => catCmp(a.k, b.k) || (num(a.cp) ?? 999) - (num(b.cp) ?? 999));
    return `<h2><a href="../${esc(s)}/">${esc(NODATE(c.title))}</a> <small>${fdate(c.date)} · ${rs.length}</small></h2><div class="scroll"><table class="cards"><thead><tr>
      <th data-card="name" data-short="">שם</th><th>קטגוריה</th><th data-card="rank" data-short="">מקום</th><th data-card="main" data-short="">זמן</th><th>פער</th><th data-short="טעויות">% בטעויות</th><th data-tt="no" data-card="full"></th></tr></thead><tbody>
      ${rs.map(x => { const i = SHOWN.push(x) - 1, hh = `#v=runner&c=${encodeURIComponent(x.c || "")}&r=${encodeURIComponent(x.r || "")}`;
        return `<tr><td class="n">${esc(x.n)}</td><td>${esc(x.k)}</td><td data-v="${done(x) ? x.cp : ""}">${done(x) ? `${x.cp}${x.f ? ` <small>מתוך ${x.f}</small>` : ""}` : x.st === "MP" ? "פסילה" : "לא סיים"}</td>
          <td data-v="${done(x) ? x.t : ""}">${done(x) ? ft(x.t) : "–"}</td><td data-v="${behind(x) ?? ""}">${behind(x) != null ? (x.cp === 1 ? "" : `<span dir="ltr">+${ft(x.t - x.w)}</span>`) : "–"}</td>
          <td>${done(x) && num(x.m) != null ? (x.m / x.t * 100).toFixed(0) + "%" : "–"}</td>
          <td><a href="../${esc(s)}/${esc(hh)}">כרטיס נווט ←</a> · <button type="button" class="share" data-share="${i}">📤 שיתוף</button></td></tr>`; }).join("")}
      </tbody></table></div>`; }).join("") || `<p class="empty">אין תוצאות${$("young").checked ? " של צעירים" : ""}.</p>`;
  tableTools($("list"), `club-${club}`);
}
$("club").onchange = () => { location.hash = "#" + new URLSearchParams({ c: $("club").value }).toString(); };
$("young").onchange = render;
$("list").addEventListener("click", e => { const b = e.target.closest("[data-share]"); if (!b) return;
  const x = SHOWN[+b.dataset.share], c = COMPS[x.s];
  shareCard({ name: x.n, club: $("ttl").textContent, comp: NODATE(c.title), date: fdate(c.date), cat: x.k, cp: done(x) ? x.cp : null, f: x.f, t: done(x) ? x.t : null,
              behind: done(x) && num(x.w) ? x.t - x.w : null, m: x.m, st: x.st }); });
addEventListener("hashchange", render);
render();
a11yInit($("a11yb")); themeInit($("theme"));
</script>
