* { box-sizing: border-box; }

/* the reading aids (classes on <html>) */
:root.a-gray :is(.wrap > header, header.mast, #tabs, #pgtop, .ctxbar, main, footer, .bnav, .bar-top:not(.open)) { filter: grayscale(1); }
:root.a-links a { background: #fff200 !important; color: #000 !important; text-decoration: underline !important; text-underline-offset: 3px; outline: 1px solid #000; border-radius: 2px; }
:root.a-font, :root.a-font * { font-family: Arial, Helvetica, sans-serif !important; }
:root.a-space :is(p, li, td, th, label, dd, dt, small, .desc, .note, .status, .lead) { line-height: 1.9 !important; letter-spacing: .05em !important; word-spacing: .15em !important; }
:root.a-focus :focus { outline: 3px solid #ffbf00 !important; outline-offset: 2px !important; box-shadow: 0 0 0 6px #000 !important; }
:root.a-motion *, :root.a-motion *::before, :root.a-motion *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }

/* the privacy notice: no cookies, only the preferences in this browser */
.notice { position: fixed; z-index: 44; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); max-width: 780px; margin: 0 auto;
          background: var(--surface); color: var(--ink); border: 1px solid var(--ring); border-radius: 12px; box-shadow: 0 8px 28px rgba(0,0,0,.22);

.notice p { margin: 0; flex: 1 1 300px; line-height: 1.5; }
.notice .nb { display: flex; gap: 8px; flex-wrap: wrap; }
.notice button { font: inherit; font-weight: 600; border-radius: 8px; padding: 8px 14px; cursor: pointer; border: 1px solid var(--accent); }
.notice .ok { background: var(--tab-on); color: var(--on-accent, #fff); } .notice .del { background: var(--surface); color: var(--accent); }
/* "skip to the content": the first stop of the keyboard */
.skip { position: fixed; right: 10px; top: -80px; z-index: 60; background: var(--tab-on); color: var(--on-accent, #fff) !important; padding: 10px 16px; border-radius: 8px;
        font-weight: 700; text-decoration: none; }
.skip:focus { top: 10px; }
/* tables: sort by a header click, ▾ opens sort + filter (as in Excel), a bar above the table resets it */
th.tt { cursor: pointer; user-select: none; -webkit-user-select: none; }
th.tt:hover { color: var(--ink); }
th.tt-asc, th.tt-desc { color: var(--accent); }
.ttb { font: calc(10px * var(--ts, 1))/1 system-ui, sans-serif; margin-inline-start: 4px; padding: 3px 4px; border: 1px solid var(--ring); border-radius: 4px;
       background: var(--surface); color: var(--muted); cursor: pointer; vertical-align: middle; }
.ttb:hover, th.tt-asc .ttb, th.tt-desc .ttb { color: var(--accent); border-color: var(--accent); }
.ttb.on { background: var(--tab-on); border-color: var(--tab-on); color: var(--on-accent, #fff) !important; }
tr.tt-hide { display: none; }
/* the two buttons in the top corner of every page: accessibility, and light / dark (its name next to it where there is room) */
.hicons { display: flex; gap: 6px; align-items: center; flex: none; }
.hicons button { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-width: 38px; height: 38px; padding: 0 11px;
  font: inherit; font-size: calc(13px * var(--ts, 1)); font-weight: 500; line-height: 1; color: var(--ink-2); background: var(--surface); border: 1px solid var(--ring);
  border-radius: 8px; cursor: pointer; }
.hicons button:hover { color: var(--accent); border-color: var(--accent); }
.hicons svg { width: 18px; height: 18px; flex: none; }

@media print { .hicons { display: none !important; } }
/* the bar at the top of a page: the way to the site's other pages (on the right), the corner buttons (on the left), the
   outside links after them; a line under it keeps it apart from the page itself. The same on every page. */
.sitebar { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; grid-template-areas: "nav more icons"; align-items: start; gap: 8px;
  padding-bottom: 12px; margin-bottom: 14px; border-bottom: 1px solid var(--grid); }
.sitebar > nav.navlinks { grid-area: nav; } .sitebar > .navlinks.more { grid-area: more; } .sitebar > .hicons { grid-area: icons; }
.navlinks { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; min-width: 0; }
.sitebar .navlinks a, .sitebar .navlinks button { display: inline-flex; align-items: center; gap: 6px; height: 38px; padding: 0 14px; font: inherit; font-size: calc(14px * var(--ts, 1));
  font-weight: 600; color: var(--accent); background: var(--surface); border: 1px solid var(--ring); border-radius: 8px; text-decoration: none;
  white-space: nowrap; cursor: pointer; }
.sitebar .navlinks a:hover, .sitebar .navlinks button:hover { border-color: var(--accent); }
.sitebar .navlinks a.home { color: var(--on-accent, #fff); background: var(--tab-on, color-mix(in srgb, var(--accent) 88%, #000)); border-color: transparent; }
.sitebar .navlinks a.home:hover { background: color-mix(in srgb, var(--accent) 76%, #000); }
@media (max-width: 640px) {   /* phones: the site's pages and the corner buttons, then the outside links in a row of their own */
  .sitebar { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "nav icons" "more more"; margin-bottom: 10px; padding-bottom: 10px; }
  .navlinks { gap: 6px; } .sitebar .navlinks a, .sitebar .navlinks button { height: 36px; padding: 0 11px; font-size: calc(13px * var(--ts, 1)); }
  .sitebar .navlinks { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; overscroll-behavior-x: contain; padding-bottom: 2px; }
  .sitebar .navlinks::-webkit-scrollbar { display: none; } .sitebar .navlinks > * { flex: none; } }   /* one row each, sideways */
/* the row number (מס״ד) each table starts with: narrow and quiet */
th.ttn, td.ttn { width: 1%; white-space: nowrap; text-align: center; color: var(--muted); font-variant-numeric: tabular-nums; }
td.ttn { font-size: calc(12px * var(--ts, 1)); }
.ttbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin: 0 0 8px; padding: 6px 10px; border-radius: 8px;
         font-size: calc(12px * var(--ts, 1)); color: var(--ink-2); background: color-mix(in srgb, var(--accent) 10%, transparent); }
.ttbar[hidden] { display: none; }
.ttbar button { font: inherit; font-weight: 600; color: var(--accent); background: var(--surface); border: 1px solid var(--accent);
                border-radius: 6px; padding: 4px 10px; cursor: pointer; margin-inline-start: auto; }
.ttbar button:hover { background: var(--tab-on); color: var(--on-accent, #fff); }
.ttpop { position: fixed; z-index: 40; width: 270px; max-width: calc(100vw - 16px); background: var(--surface); color: var(--ink);
         border: 1px solid var(--ring); border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.25); padding: 10px; font-size: calc(13px * var(--ts, 1));
         display: flex; flex-direction: column; gap: 6px; direction: rtl; text-align: right; }
.ttpop .tthead small { display: block; color: var(--muted); font-size: calc(11px * var(--ts, 1)); font-weight: 400; }
.ttpop .ttsort { font: inherit; text-align: right; background: none; border: 0; border-radius: 6px; padding: 7px 8px; color: var(--ink); cursor: pointer; }
.ttpop .ttsort:hover, .ttpop .ttsort.on { background: var(--chip); }
.ttpop .ttsort.on { font-weight: 600; color: var(--accent); }
.ttpop .ttsep { border-top: 1px solid var(--grid); }

.ttpop .ttall, .ttpop .ttfoot { display: flex; gap: 6px; }
.ttpop .ttall button, .ttpop .ttfoot button { flex: 1; font: inherit; padding: 6px 8px; border: 1px solid var(--ring); border-radius: 6px;
                                             background: var(--chip); color: var(--ink); cursor: pointer; white-space: nowrap; }

@media (pointer: coarse) { .ttb { font-size: calc(12px * var(--ts, 1)); padding: 6px 7px; } .ttpop .ttlist label { padding: 9px 0; } .ttpop .ttsort { padding: 10px 8px; }
  .ttpop .ttall button, .ttpop .ttfoot button { padding: 10px 8px; } .ttbar button { padding: 8px 12px; } }
@media (max-width: 640px) {   /* phones: a sheet at the bottom of the screen */
  .ttpop { left: 0 !important; right: 0; top: auto !important; bottom: 0; width: auto; max-width: none; max-height: 86vh;
           border-radius: 14px 14px 0 0; padding: 14px 14px calc(14px + env(safe-area-inset-bottom)); }

  table.cards, table.cards tbody, table.cards tfoot { display: block; }
  table.cards thead { display: none; }

  .cdtools button { font: inherit; font-size: calc(14px * var(--ts, 1)); font-weight: 600; color: var(--accent); background: var(--surface); border: 1px solid var(--accent);

const ttLabel = th => [...th.childNodes].filter(n => !n.classList?.contains("ttb")).map(n => n.textContent).join(" ").replace(/\s+/g, " ").trim();
const ttTable = k => [...document.querySelectorAll("table[data-ttkey]")].find(t => t.dataset.ttkey === k);
const ttBarOf = tb => { const at = tb.closest(".scroll") || tb; return at.previousElementSibling?.classList.contains("ttbar") ? at.previousElementSibling : null; };

function tableTools(root, scope = "") {
  if (!root) return;
  ttBind();
  root.querySelectorAll("table").forEach(tb => {
    if (!tb.tHead || !tb.tBodies[0] || tb.dataset.tt === "off" || tb.dataset.ttkey) return;
    const box = tb.closest(".card, section, aside, #me") || root;
    const title = (box.querySelector("h2, h3")?.textContent || "").replace(/\s+/g, " ").trim();
    tb.dataset.ttkey = `${scope}|${title}|${[...box.querySelectorAll("table")].indexOf(tb)}`;
    // every table starts with the row number (מס״ד): the rows in the order they are shown now, after sorting and filtering
    [...tb.tHead.rows].forEach((tr, i, all) => tr.insertAdjacentHTML("afterbegin", i === all.length - 1
      ? `<th class="ttn" scope="col" data-tt="no" data-short="">מס״ד</th>` : `<th class="ttn"></th>`));
    [...tb.tBodies[0].rows, ...(tb.tFoot ? tb.tFoot.rows : [])].forEach(r => r.insertAdjacentHTML("afterbegin", `<td class="ttn"></td>`));
    ttRows(tb).forEach((r, i) => r.dataset.tti = i);
    const head = ttHead(tb);
    // the card view on phones: each cell learns its column's short name and its role (rank / name / main ...)
    if (tb.classList.contains("cards")) {
      const short = th => [...th.childNodes].filter(n => n.nodeName !== "SMALL").map(n => n.textContent).join(" ").replace(/\s+/g, " ").trim();
      const lab = head.map(th => th.dataset.short ?? short(th)), role = head.map(th => th.dataset.card);
      ttRows(tb).forEach(r => [...r.cells].forEach((td, j) => { if (td.dataset.l == null && lab[j]) td.dataset.l = lab[j];
        if (role[j]) td.classList.add("cd-" + role[j]); }));
    }
    head.forEach((th, j) => {
      if (th.dataset.tt === "no") return;
      th.classList.add("tt");
      th.insertAdjacentHTML("beforeend", `<button type="button" class="ttb" data-ttc="${j}" aria-label="מיון וסינון" aria-haspopup="dialog">▾</button>`);
    });
    const bar = document.createElement("div"); bar.className = "ttbar"; bar.hidden = true;
    const at = tb.closest(".scroll") || tb; at.parentNode.insertBefore(bar, at);
    if (tb.classList.contains("cards") && head.some(th => th.dataset.tt !== "no")) {   // phones: the header is hidden, this button lists its columns
      const tools = document.createElement("div"); tools.className = "cdtools";
      tools.innerHTML = `<button type="button" data-ttcols="${ttEsc(tb.dataset.ttkey)}" aria-haspopup="dialog">⇅ מיון וסינון</button><small></small>`;
      at.parentNode.insertBefore(tools, bar);
    }
    ttApply(tb);
  });
}

function ttApply(tb) {
  const st = TT.st[tb.dataset.ttkey] || {}, ex = st.ex || {}, rows = ttRows(tb), head = ttHead(tb), body = tb.tBodies[0];
  const cols = Object.keys(ex);
  let shown = 0;
  rows.forEach(r => { const ok = cols.every(j => !ex[j].has(ttText(r.cells[j]))); r.classList.toggle("tt-hide", !ok); shown += ok; });
  const order = rows.slice().sort((a, b) => a.dataset.tti - b.dataset.tti);
  if (st.sort) {
    const [j, dir] = st.sort, v = new Map(rows.map(r => [r, ttKey(r.cells[j])])), vals = [...v.values()].filter(x => x != null);
    const num = vals.filter(x => typeof x === "number").length * 2 >= vals.length;
    order.sort((a, b) => ttCmp(v.get(a), v.get(b), dir, num) || a.dataset.tti - b.dataset.tti);
  }
  order.forEach(r => body.appendChild(r));
  let n = 0;
  order.forEach(r => { const c = r.cells[0]; if (c?.classList.contains("ttn")) c.textContent = r.classList.contains("tt-hide") ? "" : ++n; });
  head.forEach((th, j) => { const b = th.querySelector(".ttb"); if (!b) return;
    const s = st.sort?.[0] === j ? st.sort[1] : 0;
    th.classList.toggle("tt-asc", s > 0); th.classList.toggle("tt-desc", s < 0);
    th.setAttribute("aria-sort", s > 0 ? "ascending" : s < 0 ? "descending" : "none");
    b.classList.toggle("on", !!ex[j]?.size); b.textContent = s > 0 ? "▲" : s < 0 ? "▼" : "▾"; });
  const bar = ttBarOf(tb); if (!bar) return;
  const hint = bar.previousElementSibling?.classList.contains("cdtools") && bar.previousElementSibling.querySelector("small");
  if (hint) hint.textContent = `${shown < rows.length ? `${shown} מתוך ${rows.length}` : rows.length} שורות · לפי כל עמודה`;
  bar.hidden = !(st.sort || cols.length);
  if (bar.hidden) return;
  const name = j => `<b>${ttEsc(ttLabel(head[j]) || "☆")}</b>`;
  bar.innerHTML = `<span>${shown < rows.length ? `מוצגות <b>${shown}</b> מתוך ${rows.length} שורות` : `${rows.length} שורות`}`
    + (st.sort ? ` · ממוין לפי ${name(st.sort[0])} ${st.sort[1] > 0 ? "↑" : "↓"}` : "")
    + (cols.length ? ` · מסונן לפי ${cols.map(name).join(", ")}` : "") + `</span>`
    + `<button type="button" data-ttreset="1" data-tip="המיון והסדר המקוריים, בלי סינון">↺ איפוס לברירת המחדל</button>`;
}

function ttSet(k, f) {
  const st = TT.st[k] || (TT.st[k] = {}); st.ex ||= {};
  f(st);
  Object.keys(st.ex).forEach(j => st.ex[j].size || delete st.ex[j]);
  if (!st.sort && !Object.keys(st.ex).length) delete TT.st[k];
  const tb = ttTable(k); if (tb) ttApply(tb);
}

function ttOpen(btn) {
  ttClose();
  const th = btn.closest("th"), tb = th.closest("table"), k = tb.dataset.ttkey, j = +btn.dataset.ttc;
  const st = TT.st[k] || {}, ex = st.ex || {};
  // the values of the rows that pass the other columns' filters, as in Excel
  const pass = r => Object.keys(ex).every(c => +c === j || !ex[c].has(ttText(r.cells[c])));
  const counts = new Map();
  ttRows(tb).filter(pass).forEach(r => { const v = ttText(r.cells[j]); counts.set(v, (counts.get(v) || 0) + 1); });
  (ex[j] || []).forEach(v => counts.has(v) || counts.set(v, 0));
  const vals = [...counts.keys()], sv = vals.map(ttVal);
  const num = sv.filter(x => typeof x === "number").length * 2 >= sv.filter(x => x != null).length;
  const order = vals.map((_, i) => i).sort((a, b) => ttCmp(sv[a], sv[b], 1, false) || vals[a].localeCompare(vals[b], "he"));
  const s = st.sort?.[0] === j ? st.sort[1] : 0, hint = th.dataset.tth;
  const pop = document.createElement("div");
  pop.className = "ttpop"; pop.setAttribute("role", "dialog"); pop.setAttribute("aria-label", "מיון וסינון");
  pop.innerHTML = `<div class="tthead"><b>${ttEsc(ttLabel(th) || "עמודה")}</b>${hint ? `<small>${ttEsc(hint)}</small>` : ""}</div>
    <button type="button" class="ttsort${s > 0 ? " on" : ""}" data-dir="1">${num ? "↑ מיון מהקטן לגדול" : "↑ מיון מא׳ עד ת׳"}</button>
    <button type="button" class="ttsort${s < 0 ? " on" : ""}" data-dir="-1">${num ? "↓ מיון מהגדול לקטן" : "↓ מיון מת׳ עד א׳"}</button>
    <div class="ttsep"></div>
    <input type="search" class="ttq" placeholder="חיפוש ברשימה…" aria-label="חיפוש ברשימה" autocomplete="off">
    <div class="ttall"><button type="button" data-ttall="1">✓ בחירת הכול</button><button type="button" data-ttall="0">✕ ביטול הכול</button></div>
    <div class="ttlist">${order.map(i => `<label><input type="checkbox" data-i="${i}" ${ex[j]?.has(vals[i]) ? "" : "checked"}><span>${vals[i] === "" ? "(ריק)" : ttEsc(vals[i])}</span><small>${counts.get(vals[i])}</small></label>`).join("")}</div>
    <div class="ttfoot"><button type="button" class="ttclear" ${ex[j]?.size ? "" : "disabled"}>ניקוי הסינון</button><button type="button" class="ttcancel">ביטול</button><button type="button" class="ttok">אישור</button></div>`;
  document.body.appendChild(pop);
  TT.pop = { el: pop, k, j, vals, btn };
  if (innerWidth > 640) {                    // under the header; phones get a sheet at the bottom (CSS)
    const r = btn.getBoundingClientRect(), w = pop.offsetWidth, h = pop.offsetHeight;
    pop.style.left = Math.max(8, Math.min(innerWidth - w - 8, r.right - w)) + "px";
    pop.style.top = (r.bottom + 6 + h > innerHeight - 8 ? Math.max(8, r.top - h - 6) : r.bottom + 6) + "px";
  }
  if (!matchMedia("(pointer: coarse)").matches) pop.querySelector(".ttq").focus();
}
function ttCols(btn) {          // phones: the columns of a card table in one list; a tap opens that column's menu
  ttClose();
  const k = btn.dataset.ttcols, tb = ttTable(k); if (!tb) return;
  const st = TT.st[k] || {}, ex = st.ex || {};
  const pop = document.createElement("div");
  pop.className = "ttpop"; pop.setAttribute("role", "dialog"); pop.setAttribute("aria-label", "מיון וסינון");
  pop.innerHTML = `<div class="tthead"><b>מיון וסינון</b><small>בחרו עמודה כדי למיין לפיה או לסנן את הערכים שלה</small></div><div class="ttcols">`
    + ttHead(tb).map((th, j) => !th.querySelector(".ttb") ? "" : `<button type="button" class="ttcol" data-ttcol="${j}"><span>${ttEsc(ttLabel(th) || "עמודה " + (j + 1))}</span>`
      + `<small>${st.sort?.[0] === j ? `<b>${st.sort[1] > 0 ? "▲ ממוין" : "▼ ממוין"}</b> ` : ""}${ex[j]?.size ? "<b>מסונן</b> " : ""}‹</small></button>`).join("")
    + `</div><div class="ttfoot"><button type="button" class="ttcancel">סגירה</button></div>`;
  document.body.appendChild(pop);
  TT.pop = { el: pop, k, j: -1, vals: [], btn };
}
function ttClose() { if (!TT.pop) return; const b = TT.pop.btn; TT.pop.el.remove(); TT.pop = null; if (b?.isConnected && !matchMedia("(pointer: coarse)").matches) b.focus({ preventScroll: true }); }
function ttCanOk() { const P = TT.pop; if (!P) return;
  P.el.querySelector(".ttok").disabled = ![...P.el.querySelectorAll(".ttlist label:not([hidden]) input")].some(cb => cb.checked); }
function ttOk() {
  const P = TT.pop; if (!P || P.el.querySelector(".ttok").disabled) return;
  const searching = !!P.el.querySelector(".ttq").value.trim(), ex = new Set();
  // as in Excel: with a search, only the matching values that are ticked stay
  P.el.querySelectorAll(".ttlist input").forEach(cb => { if (!cb.checked || (searching && cb.closest("label").hidden)) ex.add(P.vals[+cb.dataset.i]); });
  ttSet(P.k, st => { if (ex.size) st.ex[P.j] = ex; else delete st.ex[P.j]; });
  ttClose();
}
function ttBind() {
  if (TT.bound) return;
  TT.bound = true;
  // capture: handled here before the page's own click handlers
  document.addEventListener("click", e => {
    const t = e.target, P = TT.pop;
    if (P && P.el.contains(t)) {
      e.stopPropagation();
      const col = t.closest("[data-ttcol]");
      if (col) { const b = ttHead(ttTable(P.k))[+col.dataset.ttcol]?.querySelector(".ttb"); if (b) ttOpen(b); return; }
      const sb = t.closest(".ttsort");
      if (sb) { const d = +sb.dataset.dir; ttSet(P.k, st => st.sort = st.sort?.[0] === P.j && st.sort[1] === d ? null : [P.j, d]); ttClose(); }
      else if (t.closest("[data-ttall]")) { const on = t.closest("[data-ttall]").dataset.ttall === "1";
        P.el.querySelectorAll(".ttlist label:not([hidden]) input").forEach(cb => cb.checked = on); ttCanOk(); }
      else if (t.closest(".ttclear")) { ttSet(P.k, st => delete st.ex[P.j]); ttClose(); }
      else if (t.closest(".ttcancel")) ttClose();
      else if (t.closest(".ttok")) ttOk();
      return;
    }
    const b = t.closest(".ttb");
    if (b) { e.stopPropagation(); e.preventDefault(); P?.btn === b ? ttClose() : ttOpen(b); return; }
    const cb = t.closest("[data-ttcols]");
    if (cb) { e.stopPropagation(); e.preventDefault(); P?.btn === cb ? ttClose() : ttCols(cb); return; }
    if (P) ttClose();                          // a click outside closes the menu and still does what it was for
    const rs = t.closest("[data-ttreset]");
    if (rs) { e.stopPropagation(); const nx = rs.closest(".ttbar")?.nextElementSibling, tb = nx?.matches("table") ? nx : nx?.querySelector("table");
      if (tb) { delete TT.st[tb.dataset.ttkey]; ttApply(tb); } return; }
    const th = t.closest("th.tt");
    if (th && th.dataset.legmap == null && !t.closest("a, button, input, select")) {
      e.stopPropagation();
      const tb = th.closest("table"), j = ttHead(tb).indexOf(th);
      ttSet(tb.dataset.ttkey, st => { const s = st.sort?.[0] === j ? st.sort[1] : 0; st.sort = s === 0 ? [j, 1] : s > 0 ? [j, -1] : null; });
    }
  }, true);
  document.addEventListener("change", e => { if (TT.pop?.el.contains(e.target)) ttCanOk(); });
  document.addEventListener("input", e => {
    if (!TT.pop || !e.target.classList?.contains("ttq")) return;
    const q = e.target.value.trim().toLowerCase();
    TT.pop.el.querySelectorAll(".ttlist label").forEach(l => l.hidden = !!q && !l.textContent.toLowerCase().includes(q));
    ttCanOk();
  });
  document.addEventListener("keydown", e => {
    if (!TT.pop) return;
    if (e.key === "Escape") { e.preventDefault(); ttClose(); }
    else if (e.key === "Enter" && e.target.classList?.contains("ttq")) { e.preventDefault(); ttOk(); }
  }, true);
}

a11yInit($("a11yb"), render); themeInit($("theme"));
render();
if (today()) setInterval(render, 30000);
// the next start, counted down every second (the list itself is drawn again every 30 seconds)
if (today()) setInterval(() => { const el = $("cd"); if (!el || NEXT == null) return;
  const s = NEXT - nowS(); if (s < 0) render(); else el.textContent = inS(s); }, 1000);
</script>
</body>
</html>
